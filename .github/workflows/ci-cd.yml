# =============================================================================
# Learning Platform CI/CD Pipeline
# =============================================================================
# Adapted from the BudgetCopilot pipeline for a single-branch (main) workflow.
#
# Triggers:
#   - PR to main:   Build client, syntax-check + unit-test server, Trivy scan (no deploy).
#                   The Claude Code review of the PR runs alongside (claude-review.yml).
#   - Push to main: Same CI checks, then Docker image → GHCR (:latest + :<sha>)
#                   → Dokploy deployment webhook (the app tracks :latest).
#   - Manual:       Rollback pointer (Dokploy dashboard).
#
# Deployment is handled by Dokploy: CI publishes the image to GHCR and calls the
# application's deployment webhook; Dokploy pulls and redeploys. Rollback =
# redeploy a previous :<sha> tag from the Dokploy UI. Runbook: docs/DEPLOYMENT.md.
#
# SonarCloud runs as Automatic Analysis on the SonarCloud side (no CI step needed;
# a CI-based scan and Automatic Analysis are mutually exclusive).
# =============================================================================

name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'rollback'
        type: choice
        options:
          - rollback

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'
  APP_URL: 'https://learning.bsf.md'

jobs:
  # ============================================
  # CI: BUILD, TEST, SCAN
  # Runs on: PRs to main AND pushes to main
  # ============================================
  ci:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: learning_test
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # --- Client ---
      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Type-check and build client
        run: npm run build --prefix client

      - name: Test client (code formatter)
        run: npm test --prefix client

      # --- Server ---
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Syntax check server
        run: npm run check --prefix server

      # Unit tests (query compat layer) + an integration smoke test that applies the
      # migrations to the service Postgres and exercises the auth/API flows.
      - name: Test server
        run: npm test --prefix server
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: learning_test
          DB_USER: learning
          DB_PASSWORD: learning
          JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789

      - name: Dependency Vulnerability Scan
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ============================================
  # RUNNER: Java sandbox for notebooks and checked tasks (runner/)
  # Unit tests, image build, then real sandboxes against the built image.
  # Publishing (GHCR + Dokploy) is the separate runner-publish job, the only one with packages: write.
  # ============================================
  runner:
    name: Runner (sandbox)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check and unit tests
        run: npm run check --prefix runner && npm test --prefix runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          load: true
          tags: lp-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
          platforms: linux/amd64
          provenance: false

      # Runs real sandbox containers through the gate: state between cells, timeouts, memory and
      # process limits, no network, forged output, System.exit, checks, teacher sessions.
      - name: Sandbox integration tests
        run: node --test runner/test/integration.test.js
        env:
          RUNNER_IT: '1'
          SANDBOX_IMAGE: lp-runner:ci

  runner-publish:
    name: Publish runner image
    runs-on: ubuntu-latest
    needs: runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "RUNNER_IMAGE=$(echo '${{ env.REGISTRY }}/${{ github.repository }}-runner' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same Dockerfile and cache as the tested build in the runner job
      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          tags: |
            ${{ env.RUNNER_IMAGE }}:latest
            ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runner
          platforms: linux/amd64
          provenance: false

      # The runner and its gate are two Dokploy applications on the same image. Without the
      # webhook secrets the image is published but nothing is redeployed (a notice, not a failure:
      # the platform keeps working against the runner already running).
      - name: Redeploy runner on Dokploy
        env:
          RUNNER_HOOK: ${{ secrets.DOKPLOY_RUNNER_WEBHOOK_URL }}
          GATE_HOOK: ${{ secrets.DOKPLOY_GATE_WEBHOOK_URL }}
        run: |
          if [ -z "$RUNNER_HOOK" ] || [ -z "$GATE_HOOK" ]; then
            echo "::notice::DOKPLOY_RUNNER_WEBHOOK_URL / DOKPLOY_GATE_WEBHOOK_URL are not set: the runner image for ${{ github.sha }} is in GHCR but was not redeployed."
            exit 0
          fi
          curl -sf -X POST "$GATE_HOOK" -H "Content-Type: application/json" || { echo "❌ gate webhook failed"; exit 1; }
          curl -sf -X POST "$RUNNER_HOOK" -H "Content-Type: application/json" || { echo "❌ runner webhook failed"; exit 1; }
          echo "✅ Runner redeploy triggered for ${{ github.sha }}"

  # ============================================
  # CD: BUILD IMAGE, PUSH TO GHCR
  # Runs on: Push to main, after CI passes
  # ============================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is the moving tag the Dokploy app tracks; :<sha> enables
      # rollback-by-tag from the Dokploy UI.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail, just report

  # ============================================
  # CD: TRIGGER DOKPLOY REDEPLOY
  # Runs on: Push to main, after the image is in GHCR
  # ============================================
  deploy:
    name: Deploy (Dokploy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ env.APP_URL }}

    steps:
      # DOKPLOY_WEBHOOK_URL is the deployment webhook of the "Learning Platform"
      # application in the Dokploy dashboard (Deployments tab → Webhook URL).
      # A missing secret FAILS the run — a silent non-deploy is worse than red.
      - name: Trigger Dokploy Deployment
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL secret is not set. The image for ${{ github.sha }} is in GHCR, but nothing was deployed. Set the secret (Dokploy → Learning Platform → Deployments → Webhook URL) and re-run this job."
            exit 1
          fi
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            || { echo "❌ Dokploy webhook failed"; exit 1; }
          echo "✅ Dokploy deployment triggered for ${{ github.sha }}"

  # ============================================
  # ROLLBACK (Manual Trigger)
  # ============================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    environment:
      name: production

    steps:
      - name: Trigger Dokploy Rollback
        run: |
          echo "⚠️  Rollback triggered — use the Dokploy dashboard to select a previous deployment (or redeploy a :<sha> tag)."
          echo "Dokploy URL: ${{ secrets.DOKPLOY_DASHBOARD_URL }}"
          echo "Rollback is managed through the Dokploy web interface."
