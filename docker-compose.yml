# =============================================================================
# Learning Platform — local development database
# Usage: docker compose up -d   (then run the server/client with npm run dev)
# The app itself is not composed here; see docs/DEPLOYMENT.md for the Dokploy setup.
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: learning-platform-db
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
